    <h1>Analizador de calificaciones</h1>
    <p>Calificaciones sobre 10. Se considera aprobada una nota igual o superior a 7.</p>

    <button id="analizar" type="button">Analizar</button>

    <section id="resultados" hidden>
        <p><strong>Calificaciones:</strong> <span id="listaNotas"></span></p>
        <p><strong>Promedio:</strong> <span id="promedio"></span></p>
        <p><strong>Nota más alta:</strong> <span id="maxima"></span></p>
        <p><strong>Nota más baja:</strong> <span id="minima"></span></p>
        <p><strong>Aprobadas:</strong> <span id="aprobadas"></span></p>
        <p><strong>No aprobadas:</strong> <span id="noAprobadas"></span></p>
    </section>
</body>
